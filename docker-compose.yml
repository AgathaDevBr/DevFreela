services:
  devfreela.api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DevFreelaCs: Server=sqlserver,1433;Database=DevFreela;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      Jwt__Issuer: DevFreela
      Jwt__Audience: DevFreela
      Jwt__SecretKey: devfreela-local-development-secret-key-32-chars
      Jwt__DemoPassword: devfreela123
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      RabbitMQ__QueueName: project-created
      Database__EnsureCreated: "true"
    depends_on:
      - sqlserver
      - rabbitmq

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Your_password123
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  sqlserver-data:
